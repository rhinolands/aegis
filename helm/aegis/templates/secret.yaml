# Values are supplied at install time (--set, --set-file, sealed-secrets, or an
# external-secrets pipeline) and MUST NOT be committed to values.yaml or any
# values override checked into git. Defaults in values.yaml are empty strings.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  AUDIT_MASTER_KEY: {{ .Values.secrets.auditMasterKey | quote }}
  EXPORT_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  EXPORT_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
