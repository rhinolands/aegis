name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aegis:dev@localhost:5432/aegis
      # Throwaway all-zero base64 key for CI only — NOT a real secret. Real
      # keys come from GitHub Actions secrets / sealed secrets in deploys.
      AUDIT_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # RUN_S3_INTEGRATION=1 makes the S3 export test a hard gate: if the
      # S3 store is unreachable when this is set, the test FAILS rather than
      # silently skipping (see test/audit-export.test.ts).
      RUN_S3_INTEGRATION: "1"
      EXPORT_S3_ENDPOINT: http://localhost:9000
      EXPORT_S3_BUCKET: aegis-audit
      EXPORT_S3_ACCESS_KEY: aegis
      EXPORT_S3_SECRET_KEY: aegis12345
      EXPORT_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      # S3-compatible store for the export integration test. MinIO images are
      # no longer anonymously pullable from any registry (bitnami/minio removed,
      # then minio/minio and quay.io/minio/minio both return unauthorized), so
      # CI uses SeaweedFS (Apache-2.0, public Docker Hub image, pinned). The
      # test only needs HeadBucket/CreateBucket/PutObject/GetObject with
      # path-style addressing. The identity file enforces the same aegis
      # credentials, so unsigned requests are rejected (403).
      # Run as a step, not services:, because services: cannot set a command.
      - name: start S3 store (SeaweedFS)
        run: |
          printf '{"identities":[{"name":"aegis","credentials":[{"accessKey":"aegis","secretKey":"aegis12345"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 \
            -p 9000:9000 \
            -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json

          echo "waiting for the S3 endpoint..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:9000; then
              echo "S3 endpoint is up after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "S3 endpoint failed to come up in time"
              docker logs s3
              exit 1
            fi
            sleep 2
          done

      - name: create S3 bucket
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb "s3://${EXPORT_S3_BUCKET}"
        env:
          AWS_ACCESS_KEY_ID: aegis
          AWS_SECRET_ACCESS_KEY: aegis12345
          AWS_DEFAULT_REGION: us-east-1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install opa
        run: |
          curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          sudo chmod +x /usr/local/bin/opa
          opa version

      - run: npm ci

      - name: build (policy WASM + tsc)
        run: npm run build

      - run: npm run typecheck

      - name: opa test (policy/bundle)
        run: opa test policy/bundle -v

      - name: migrate
        run: npx drizzle-kit migrate

      - name: test (vitest, serial — shared Postgres + hash chain)
        run: npm test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE (owner action required): for this job to actually do anything, the
  # cla-assistant GitHub App must be installed on rhinolands/aegis by an org
  # owner (https://github.com/apps/cla-assistant), and a PERSONAL_ACCESS_TOKEN
  # secret (a PAT with repo scope for the bot identity that signs commits/
  # comments on PRs) must be added to the repo. Until both are done, this job
  # is a deliberate no-op — see the gating below — rather than a permanent
  # red X that trains contributors to ignore CI.
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    # The `secrets` context is NOT available in step-level `if:` expressions —
    # using it there makes GitHub reject the whole workflow file before any job
    # starts (that is what broke run 29935052845). It IS allowed in a job-level
    # `env:`, so map it once here and gate the steps on the env value instead.
    env:
      HAS_CLA_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
    steps:
      - name: CLA Assistant
        if: env.HAS_CLA_PAT == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/rhinolands/aegis/blob/main/CLA.md"
          branch: main
          allowlist: dependabot[bot]

      - name: CLA setup pending
        if: env.HAS_CLA_PAT != 'true'
        run: |
          echo "::notice::cla-assistant is not configured yet (no PERSONAL_ACCESS_TOKEN secret) — an owner must install the GitHub App and add the secret. This job is non-blocking until then."
