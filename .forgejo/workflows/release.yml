# Tagged-release pipeline (OSS-02 SC3).
#
# On a `v*` tag pushed to the FORGEJO remote, build the versioned container image
# and package+push the Helm chart to the configured OCI registry (vars.REGISTRY_HOST,
# D-04). A single VERSION derived from the tag is stamped into BOTH artifacts
# (reproducible-from-tag, D-07): tag == image tag == chart version.
#
# Registry topology is NOT hardcoded — it is supplied via Forgejo Actions repo
# variables so this file is generic/publishable:
#   - vars.REGISTRY_HOST       the OCI registry host:port (e.g. the homelab registry)
#   - vars.REGISTRY_NAMESPACE  the owner/namespace under it (e.g. rhinom)
#   - vars.REGISTRY_PLAIN_HTTP "true" for a plain-HTTP registry; empty/false for TLS
# IMAGE and CHART_REPO are DERIVED from these at runtime (Actions `env:` blocks cannot
# reference sibling env vars, so they are computed in the "Derive VERSION" step).
#
# Load-bearing constraint (49-RESEARCH Pitfall 1): GitHub-hosted cloud runners
# cannot reach a private-LAN registry, so this MUST run on the self-hosted `ct102`
# runner (same runner as .forgejo/workflows/e2e.yml).
#
# Environment (verified in 49-RELEASE-PROOF.md, wave-0 probe):
#   - ct102 has docker 29.3.1 + buildx v0.31.1; helm is ABSENT -> self-installed below.
#   - The homelab OCI registry is Forgejo's, plain HTTP (no TLS), so REGISTRY_PLAIN_HTTP
#     is set "true" for the homelab run. In that mode the host daemon has NO
#     /etc/docker/daemon.json insecure-registries, so the HTTP allowance is scoped to a
#     dedicated buildx builder (buildkitd config) rather than mutating the host daemon,
#     and helm uses its native --plain-http flag. Against a normal TLS registry
#     (REGISTRY_PLAIN_HTTP not "true"), the default builder is used and --plain-http
#     is dropped, so the pipeline is generic.
#   - Auth is the built-in Forgejo Actions token (github.token, auto-injected per run,
#     scoped by `permissions: packages: write`) as the pushing actor (github.actor).
#     No CI secret to create, no personal/shared token stored (Forgejo 14.0.3 supports
#     the auto token pushing to its own package registry). The token embedded in the
#     git-remote URL is NEVER used for registry auth and never referenced here (T-49-04-01).
#
# This authors the pipeline only. The LIVE tagged-release run (real publication,
# danger-zone, operator/money-gated) is plan 49-06.

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ct102
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.REGISTRY_HOST }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
      REGISTRY_PLAIN_HTTP: ${{ vars.REGISTRY_PLAIN_HTTP }}
      HELM_VERSION: v3.16.3
      # The ct102 runner executes jobs inside the `node:20-bookworm` image
      # (runner-config label `ct102:docker://node:20-bookworm`), which ships node
      # only — no docker CLI, no helm. The host docker daemon IS reachable via the
      # runner's `docker_host: automount` (socket + DOCKER_HOST injected), so the
      # job self-installs the docker CLI + buildx plugin (static binaries) and drives
      # the host daemon. Verify tooling in the ACTUAL job container, never on the CT host.
      DOCKER_CLI_VERSION: "27.5.1"
      BUILDX_VERSION: v0.19.3
    steps:
      - uses: actions/checkout@v4

      - name: Derive VERSION + registry refs from the tag and repo vars (single source of truth — D-07)
        # v1.2.3 -> 1.2.3 ; this same VERSION stamps the image tag AND the chart
        # version/appVersion, so the tag is the only place a release version is set.
        # IMAGE + CHART_REPO are derived here because Actions `env:` blocks cannot
        # reference sibling env vars. HELM_PLAIN_HTTP is the conditional --plain-http
        # flag (set only for a plain-HTTP registry; empty for a TLS registry).
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/aegis" >> "$GITHUB_ENV"
          echo "CHART_REPO=oci://${REGISTRY}/${REGISTRY_NAMESPACE}" >> "$GITHUB_ENV"
          if [ "${REGISTRY_PLAIN_HTTP}" = "true" ]; then
            echo "HELM_PLAIN_HTTP=--plain-http" >> "$GITHUB_ENV"
          else
            echo "HELM_PLAIN_HTTP=" >> "$GITHUB_ENV"
          fi

      - name: Install docker CLI + buildx (job image node:20-bookworm has neither; host daemon via docker_host automount)
        # The static docker CLI talks to the host daemon over the automounted socket
        # (DOCKER_HOST is injected by the runner). buildx is installed as a CLI plugin.
        # Mirrors the self-provisioning helm step below — no apt, no host mutation.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) DK_ARCH=x86_64; BX_ARCH=amd64 ;;
            aarch64|arm64) DK_ARCH=aarch64; BX_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/bin" "$HOME/.docker/cli-plugins"
          curl -fsSL -o /tmp/docker.tgz "https://download.docker.com/linux/static/stable/${DK_ARCH}/docker-${DOCKER_CLI_VERSION}.tgz"
          tar -xzf /tmp/docker.tgz -C /tmp
          mv /tmp/docker/docker "$HOME/bin/docker"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BX_ARCH}"
          chmod +x "$HOME/bin/docker" "$HOME/.docker/cli-plugins/docker-buildx"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          docker version           # Client (installed) + Server (host daemon via automount) — fails fast if the socket is not wired
          docker buildx version

      - name: Install pinned Helm (probe A1 — ct102 has no helm; >=3.8 required for OCI, >=3.13 for --plain-http)
        run: |
          case "$(uname -m)" in
            x86_64) HELM_ARCH=amd64 ;;
            aarch64|arm64) HELM_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/bin"
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"
          tar -xzf /tmp/helm.tgz -C /tmp
          mv "/tmp/linux-${HELM_ARCH}/helm" "$HOME/bin/helm"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/helm" version

      - name: Registry auth (built-in Actions token — piped, never echoed)
        # Credentials are written straight into ~/.docker/config.json (base64 auth,
        # umask 077, never echoed) so buildkit can consume them without a `docker login`
        # network handshake — required for the plain-HTTP registry (a plain `docker
        # login` would fail the HTTPS->HTTP handshake when the host daemon has no
        # insecure-registries) and harmless for a TLS registry.
        # Auth = the auto-injected Forgejo Actions token (github.token) as the pushing
        # actor (github.actor); scoped by the job `permissions: packages: write`. No CI
        # secret to create, no personal/shared token stored (Forgejo 14.0.3 supports it).
        env:
          REG_USER: ${{ github.actor }}
          REG_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$HOME/.docker"
          AUTH="$(printf '%s:%s' "$REG_USER" "$REG_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
          # No `helm registry login`: helm 3.16 `registry login` has no --plain-http, and
          # its registry-config uses the SAME auths format as docker's config.json. So the
          # helm push step reads these credentials via `--registry-config ~/.docker/config.json`
          # and does the HTTP negotiation with its own --plain-http flag (HELM_PLAIN_HTTP).

      - name: Create HTTP-scoped buildx builder (plain-HTTP registry only — do NOT mutate the host daemon — probe A4)
        # Only needed when the configured OCI registry (vars.REGISTRY_HOST) is plain HTTP:
        # buildkitd config marks that registry http+insecure for THIS build only; no
        # /etc/docker/daemon.json change, no host daemon restart. Skipped for a TLS
        # registry (the default builder is used instead).
        if: env.REGISTRY_PLAIN_HTTP == 'true'
        run: |
          cat > /tmp/buildkitd.toml <<EOF
          [registry."${REGISTRY}"]
            http = true
            insecure = true
          EOF
          docker buildx create --name aegis-release --use --driver docker-container --config /tmp/buildkitd.toml
          docker buildx inspect --bootstrap

      - name: Build + push image and record the digest (SC3 provenance)
        # --metadata-file is the authoritative digest source: `imagetools inspect`
        # (below) is not guaranteed over a plain-HTTP registry, so the pinnable
        # digest for the SC3 citation is read from the build metadata. Uses whichever
        # builder is active — the scoped HTTP builder above for a plain-HTTP registry,
        # or the default builder for a TLS registry.
        run: |
          docker buildx build --push \
            --metadata-file /tmp/build-meta.json \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .
          DIGEST="$(grep -o '"containerimage.digest": *"[^"]*"' /tmp/build-meta.json | grep -o 'sha256:[a-f0-9]\{64\}')"
          echo "Image digest (authoritative, from build metadata): $DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Emit image digest via imagetools inspect (SC3 citation; best-effort over HTTP)
        # Kept for the SC3 pin as the research Pattern-1 citation; allowed to no-op if
        # imagetools cannot negotiate a plain-HTTP registry — the digest above stands.
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{println .Manifest.Digest}}' || \
            echo "imagetools inspect unavailable over HTTP; using build-metadata digest ${IMAGE_DIGEST}"

      - name: Package + push Helm chart (SAME tag-derived VERSION — D-07)
        # --version/--app-version override Chart.yaml's 0.1.0 at package time only:
        # no tracked-file mutation, no release commit, no drift. `helm push` infers the
        # chart name (aegis) and tag (chart version) from the .tgz, so the OCI ref has
        # no trailing name. HELM_PLAIN_HTTP is --plain-http only for a plain-HTTP registry.
        run: |
          helm package helm/aegis --version "${VERSION}" --app-version "${VERSION}"
          helm push "aegis-${VERSION}.tgz" "${CHART_REPO}" ${HELM_PLAIN_HTTP} \
            --registry-config "$HOME/.docker/config.json"

      - name: Remove the scoped buildx builder
        if: always() && env.REGISTRY_PLAIN_HTTP == 'true'
        run: docker buildx rm aegis-release || true
