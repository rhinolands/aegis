# Tagged-release pipeline.
#
# On a `v*` tag, build the versioned container image and package and push the
# Helm chart to an OCI registry. One VERSION derived from the tag is stamped into
# both artifacts: tag == image tag == chart version.
#
# The registry is not hardcoded. It comes from repository variables:
#   - vars.REGISTRY_HOST       the OCI registry host, with a port if needed
#   - vars.REGISTRY_NAMESPACE  the owner or namespace under it
#   - vars.REGISTRY_PLAIN_HTTP "true" for a registry without TLS. Empty or false for TLS
# IMAGE and CHART_REPO are derived from these at runtime in the "Derive VERSION" step.
# Actions `env:` blocks cannot reference sibling env vars.
#
# Runner: a self-hosted runner that can reach the registry. Docker and Helm are
# installed by the job itself.
#
# Auth: a registry token with package write scope, stored as the Actions secret
# FORGEJO_REGISTRY_TOKEN. The user is vars.REGISTRY_NAMESPACE.

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      REGISTRY: ${{ vars.REGISTRY_HOST }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
      REGISTRY_PLAIN_HTTP: ${{ vars.REGISTRY_PLAIN_HTTP }}
      HELM_VERSION: v3.16.3
      # The job container may ship without the docker CLI or helm, so the job
      # installs both. It needs access to a Docker daemon from the runner.
      DOCKER_CLI_VERSION: "27.5.1"
      BUILDX_VERSION: v0.19.3
    steps:
      - uses: actions/checkout@v4

      - name: Derive VERSION and registry refs from the tag and repo vars
        # v1.2.3 -> 1.2.3. This same VERSION stamps the image tag AND the chart
        # version/appVersion, so the tag is the only place a release version is set.
        # IMAGE + CHART_REPO are derived here because Actions `env:` blocks cannot
        # reference sibling env vars. HELM_PLAIN_HTTP is the conditional --plain-http
        # flag. It is set only for a registry without TLS and is empty with TLS.
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/aegis" >> "$GITHUB_ENV"
          # The chart goes under its own OCI path (.../charts/aegis). It must not share
          # the image's repo path. helm push infers the chart name (aegis) from the .tgz,
          # so pushing to the namespace root would collide with the image tag. The last
          # push would win and orphan the image. The .../charts path keeps them apart.
          echo "CHART_REPO=oci://${REGISTRY}/${REGISTRY_NAMESPACE}/charts" >> "$GITHUB_ENV"
          if [ "${REGISTRY_PLAIN_HTTP}" = "true" ]; then
            echo "HELM_PLAIN_HTTP=--plain-http" >> "$GITHUB_ENV"
          else
            echo "HELM_PLAIN_HTTP=" >> "$GITHUB_ENV"
          fi

      - name: Install docker CLI and buildx
        # Static docker CLI plus the buildx CLI plugin. Mirrors the helm step below.
        # No package manager and no change to the host.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) DK_ARCH=x86_64; BX_ARCH=amd64 ;;
            aarch64|arm64) DK_ARCH=aarch64; BX_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/bin" "$HOME/.docker/cli-plugins"
          curl -fsSL -o /tmp/docker.tgz "https://download.docker.com/linux/static/stable/${DK_ARCH}/docker-${DOCKER_CLI_VERSION}.tgz"
          tar -xzf /tmp/docker.tgz -C /tmp
          mv /tmp/docker/docker "$HOME/bin/docker"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${BX_ARCH}"
          chmod +x "$HOME/bin/docker" "$HOME/.docker/cli-plugins/docker-buildx"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          docker version           # fails fast if no Docker daemon is reachable
          docker buildx version

      - name: Install pinned Helm (3.8 or later for OCI, 3.13 or later for --plain-http)
        run: |
          case "$(uname -m)" in
            x86_64) HELM_ARCH=amd64 ;;
            aarch64|arm64) HELM_ARCH=arm64 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/bin"
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"
          tar -xzf /tmp/helm.tgz -C /tmp
          mv "/tmp/linux-${HELM_ARCH}/helm" "$HOME/bin/helm"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/helm" version

      - name: Registry auth (scoped token, never echoed)
        # Credentials are written straight into ~/.docker/config.json (base64 auth,
        # umask 077, never echoed). buildkit reads them without a `docker login`
        # handshake. That matters for a registry without TLS and is harmless with TLS.
        # Auth is a scoped token with package write access, stored as the Actions
        # secret FORGEJO_REGISTRY_TOKEN. The user is the registry namespace owner.
        env:
          REG_USER: ${{ vars.REGISTRY_NAMESPACE }}
          REG_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          umask 077
          if [ -z "${REG_TOKEN}" ]; then
            echo "FORGEJO_REGISTRY_TOKEN is not set. Create a token with package write access and add it as an Actions secret on this repo." >&2
            exit 1
          fi
          mkdir -p "$HOME/.docker"
          AUTH="$(printf '%s:%s' "$REG_USER" "$REG_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
          # No `helm registry login`: helm 3.16 `registry login` has no --plain-http, and
          # its registry-config uses the SAME auths format as docker's config.json. So the
          # helm push step reads these credentials via `--registry-config ~/.docker/config.json`
          # and does the HTTP negotiation with its own --plain-http flag (HELM_PLAIN_HTTP).

      - name: Create HTTP-scoped buildx builder (registry without TLS only)
        # Only needed when vars.REGISTRY_HOST has no TLS. The buildkitd config marks
        # that registry http and insecure for this build only. The host daemon config
        # is not changed. With a TLS registry this step is skipped and the default
        # builder is used.
        if: env.REGISTRY_PLAIN_HTTP == 'true'
        run: |
          cat > /tmp/buildkitd.toml <<EOF
          [registry."${REGISTRY}"]
            http = true
            insecure = true
          EOF
          docker buildx create --name aegis-release --use --driver docker-container --config /tmp/buildkitd.toml
          docker buildx inspect --bootstrap

      - name: Build and push image and record the digest
        # --metadata-file is the authoritative digest source. `imagetools inspect`
        # below is not guaranteed without TLS, so the digest is read from the build
        # metadata. Uses whichever builder is active.
        run: |
          docker buildx build --push \
            --metadata-file /tmp/build-meta.json \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .
          DIGEST="$(grep -o '"containerimage.digest": *"[^"]*"' /tmp/build-meta.json | grep -o 'sha256:[a-f0-9]\{64\}')"
          echo "Image digest (authoritative, from build metadata): $DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Emit image digest via imagetools inspect (best effort without TLS)
        # Allowed to no-op if imagetools cannot reach a registry without TLS. The
        # digest from the build metadata above stands.
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{println .Manifest.Digest}}' || \
            echo "imagetools inspect unavailable over HTTP; using build-metadata digest ${IMAGE_DIGEST}"

      - name: Package and push Helm chart (same tag-derived VERSION)
        # --version and --app-version override Chart.yaml's 0.1.0 at package time only.
        # No tracked file changes and no release commit. `helm push` infers the chart
        # name (aegis) and tag (chart version) from the .tgz, so the OCI ref has no
        # trailing name. HELM_PLAIN_HTTP is --plain-http only for a registry without TLS.
        run: |
          helm package helm/aegis --version "${VERSION}" --app-version "${VERSION}"
          helm push "aegis-${VERSION}.tgz" "${CHART_REPO}" ${HELM_PLAIN_HTTP} \
            --registry-config "$HOME/.docker/config.json"

      - name: Remove the scoped buildx builder
        if: always() && env.REGISTRY_PLAIN_HTTP == 'true'
        run: docker buildx rm aegis-release || true
